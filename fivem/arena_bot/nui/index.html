<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arena Bot NUI</title>
    <style>
        /* ============================================================
           Reed CSS - Arena Bot NUI Styles
           Dark gaming theme with red/blue team accents
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0c14;
            --bg-surface: #0f1219;
            --bg-surface-2: #161a24;
            --bg-card: #1a1e2a;
            --text-primary: #e8eaf0;
            --text-secondary: #7c839a;
            --text-muted: #4a5068;
            --border: #252a38;
            --border-active: #dc2626;
            --red-team: #dc2626;
            --red-team-bg: rgba(220, 38, 38, 0.08);
            --red-team-glow: rgba(220, 38, 38, 0.3);
            --blue-team: #3b82f6;
            --blue-team-bg: rgba(59, 130, 246, 0.08);
            --blue-team-glow: rgba(59, 130, 246, 0.3);
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --font-sans: 'Rajdhani', 'Segoe UI', sans-serif;
            --font-mono: 'JetBrains Mono', 'Consolas', monospace;
        }

        body {
            font-family: var(--font-sans);
            background: transparent;
            color: var(--text-primary);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: none;
        }

        body.open {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #arena-container {
            width: 420px;
            max-height: 90vh;
            background: linear-gradient(180deg, var(--bg-surface) 0%, var(--bg-primary) 100%);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            box-shadow:
                0 0 20px var(--red-team-glow),
                0 0 60px rgba(220, 38, 38, 0.1),
                0 25px 50px rgba(0, 0, 0, 0.5);
        }

        /* Header */
        .arena-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
        }

        .arena-header .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .arena-header .logo-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: var(--red-team);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px var(--red-team-glow);
        }

        .arena-header .logo-icon svg {
            width: 20px;
            height: 20px;
            stroke: white;
            fill: none;
            stroke-width: 2;
        }

        .arena-header h1 {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 10px var(--red-team-glow);
        }

        .arena-header .subtitle {
            font-size: 10px;
            font-family: var(--font-mono);
            color: var(--text-muted);
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 10px;
            font-family: var(--font-mono);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
        }

        .status-dot.live {
            background: var(--success);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Content Area */
        .arena-content {
            padding: 16px 20px;
            overflow-y: auto;
            max-height: calc(90vh - 120px);
        }

        /* Section Headers */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .section-title {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-secondary);
        }

        .section-meta {
            font-size: 10px;
            font-family: var(--font-mono);
            color: var(--text-muted);
        }

        /* Game Mode Grid */
        .mode-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .mode-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 10px 8px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .mode-btn:hover {
            border-color: var(--text-secondary);
            background: var(--bg-surface-2);
        }

        .mode-btn.active {
            border-color: var(--red-team);
            background: var(--red-team-bg);
            color: var(--red-team);
            box-shadow: 0 0 20px var(--red-team-glow);
        }

        .mode-btn .player-count {
            font-size: 9px;
            color: var(--text-muted);
        }

        /* Round/Time Grid */
        .option-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }

        .option-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn.active {
            border-color: var(--red-team);
            background: var(--red-team-bg);
            color: var(--red-team);
        }

        /* Toggle Switch */
        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-bottom: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .toggle-row.active {
            border-color: rgba(34, 197, 94, 0.4);
            background: rgba(34, 197, 94, 0.06);
        }

        .toggle-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .toggle-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-surface-2);
            color: var(--text-muted);
        }

        .toggle-icon.active {
            background: rgba(34, 197, 94, 0.15);
            color: var(--success);
        }

        .toggle-label {
            font-size: 13px;
            font-weight: 600;
        }

        .toggle-desc {
            font-size: 10px;
            color: var(--text-muted);
        }

        .toggle-switch {
            width: 44px;
            height: 24px;
            border-radius: 12px;
            background: var(--bg-surface-2);
            position: relative;
            transition: background 0.3s ease;
        }

        .toggle-switch.on {
            background: var(--success);
        }

        .toggle-switch .knob {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--text-primary);
            position: absolute;
            top: 2px;
            left: 2px;
            transition: transform 0.3s ease;
        }

        .toggle-switch.on .knob {
            transform: translateX(20px);
        }

        /* Action Buttons */
        .btn-primary {
            width: 100%;
            padding: 12px;
            background: var(--red-team);
            color: white;
            border: none;
            border-radius: 10px;
            font-family: var(--font-sans);
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 20px var(--red-team-glow);
        }

        .btn-primary:hover {
            filter: brightness(1.1);
        }

        .btn-secondary {
            padding: 10px 16px;
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-radius: 10px;
            font-family: var(--font-sans);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-secondary:hover {
            background: var(--bg-surface-2);
            border-color: var(--text-secondary);
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 12px;
        }

        /* Divider */
        .divider {
            height: 1px;
            background: var(--border);
            margin: 16px 0;
            opacity: 0.5;
        }

        /* Footer */
        .arena-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            border-top: 1px solid var(--border);
        }

        .footer-status {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .footer-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 3s infinite;
        }

        .footer-text {
            font-size: 9px;
            font-family: var(--font-mono);
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .footer-meta {
            display: flex;
            gap: 12px;
        }

        .footer-meta span {
            font-size: 9px;
            font-family: var(--font-mono);
            color: var(--text-muted);
        }

        /* Scanline overlay */
        .scanline-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 0, 0, 0.03) 2px,
                rgba(0, 0, 0, 0.03) 4px
            );
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="scanline-overlay"></div>
    <div id="arena-container">
        <!-- This container will be populated by the NUI framework -->
        <!-- In production, this HTML is replaced by the built Next.js output -->
        <!-- For standalone NUI testing, a basic fallback is provided below -->
        <div class="arena-header">
            <div class="logo-area">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/>
                        <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/>
                        <path d="M4 22h16"/>
                        <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/>
                        <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/>
                        <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>
                    </svg>
                </div>
                <div>
                    <h1>Arena Bot</h1>
                    <div class="subtitle">Competitive Match System</div>
                </div>
            </div>
            <div class="status-badge">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">IDLE</span>
            </div>
        </div>

        <div class="arena-content" id="arenaContent">
            <!-- Game Mode Selection -->
            <div class="section-header">
                <span class="section-title">Game Mode</span>
                <span class="section-meta" id="playerCount">2 Players</span>
            </div>
            <div class="mode-grid" id="modeGrid"></div>

            <div class="divider"></div>

            <!-- Round Selection -->
            <div class="section-header">
                <span class="section-title">Rounds</span>
                <span class="section-meta">Max 30</span>
            </div>
            <div class="option-grid" id="roundGrid"></div>

            <div class="divider"></div>

            <!-- Auto Revive -->
            <div class="toggle-row" id="autoReviveToggle" onclick="toggleAutoRevive()">
                <div class="toggle-info">
                    <div class="toggle-icon" id="reviveIcon">&#10084;</div>
                    <div>
                        <div class="toggle-label">Automatic Revive</div>
                        <div class="toggle-desc" id="reviveDesc">Manual revive required</div>
                    </div>
                </div>
                <div class="toggle-switch" id="reviveSwitch">
                    <div class="knob"></div>
                </div>
            </div>

            <div class="divider"></div>

            <!-- Match Controls -->
            <div class="section-header">
                <span class="section-title">Match Controls</span>
            </div>
            <button class="btn-primary" id="startBtn" onclick="startMatch()">Start Match</button>
            <div class="btn-grid" id="matchBtnGrid" style="display: none;">
                <button class="btn-secondary" id="pauseBtn" onclick="pauseMatch()">Pause</button>
                <button class="btn-secondary" onclick="stopMatch()" style="color: var(--danger);">Stop</button>
            </div>
        </div>

        <div class="arena-footer">
            <div class="footer-status">
                <div class="footer-dot"></div>
                <span class="footer-text">Arena Bot v1.0</span>
            </div>
            <div class="footer-meta">
                <span id="footerMode">Mode: 1v1</span>
                <span id="footerRounds">Rounds: 10</span>
            </div>
        </div>
    </div>

    <script>
        // ================================================================
        // NUI STATE
        // ================================================================
        let state = {
            gameMode: '1v1',
            maxRounds: 10,
            timeLimit: 20,
            autoRevive: false,
            isMatchActive: false,
            isPaused: false,
        };

        const modes = ['1v1', '2v2', '3v3', '4v4', '5v5'];
        const modePlayers = { '1v1': 2, '2v2': 4, '3v3': 6, '4v4': 8, '5v5': 10 };
        const rounds = [5, 10, 20, 30];

        // ================================================================
        // INITIALIZATION
        // ================================================================
        function init() {
            renderModeGrid();
            renderRoundGrid();
            updateFooter();
        }

        function renderModeGrid() {
            const grid = document.getElementById('modeGrid');
            grid.innerHTML = '';
            modes.forEach(mode => {
                const btn = document.createElement('button');
                btn.className = 'mode-btn' + (state.gameMode === mode ? ' active' : '');
                btn.innerHTML = `<span>${mode}</span><span class="player-count">${modePlayers[mode]}P</span>`;
                btn.onclick = () => setGameMode(mode);
                grid.appendChild(btn);
            });
            document.getElementById('playerCount').textContent = modePlayers[state.gameMode] + ' Players';
        }

        function renderRoundGrid() {
            const grid = document.getElementById('roundGrid');
            grid.innerHTML = '';
            rounds.forEach(r => {
                const btn = document.createElement('button');
                btn.className = 'option-btn' + (state.maxRounds === r ? ' active' : '');
                btn.textContent = r;
                btn.onclick = () => setRounds(r);
                grid.appendChild(btn);
            });
        }

        // ================================================================
        // ACTIONS
        // ================================================================
        function setGameMode(mode) {
            state.gameMode = mode;
            renderModeGrid();
            updateFooter();
        }

        function setRounds(r) {
            state.maxRounds = r;
            renderRoundGrid();
            updateFooter();
        }

        function toggleAutoRevive() {
            state.autoRevive = !state.autoRevive;
            const toggle = document.getElementById('autoReviveToggle');
            const icon = document.getElementById('reviveIcon');
            const sw = document.getElementById('reviveSwitch');
            const desc = document.getElementById('reviveDesc');

            if (state.autoRevive) {
                toggle.classList.add('active');
                icon.classList.add('active');
                sw.classList.add('on');
                desc.textContent = 'Players revive instantly on death';
            } else {
                toggle.classList.remove('active');
                icon.classList.remove('active');
                sw.classList.remove('on');
                desc.textContent = 'Manual revive required';
            }

            nuiPost('arena:toggleAutoRevive', { enabled: state.autoRevive });
        }

        function startMatch() {
            state.isMatchActive = true;
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('matchBtnGrid').style.display = 'grid';
            document.getElementById('statusDot').classList.add('live');
            document.getElementById('statusText').textContent = 'LIVE';

            nuiPost('arena:startMatch', {
                gameMode: state.gameMode,
                rounds: state.maxRounds,
                timeLimit: state.timeLimit,
                autoRevive: state.autoRevive,
            });
        }

        function stopMatch() {
            state.isMatchActive = false;
            state.isPaused = false;
            document.getElementById('startBtn').style.display = 'block';
            document.getElementById('matchBtnGrid').style.display = 'none';
            document.getElementById('statusDot').classList.remove('live');
            document.getElementById('statusText').textContent = 'IDLE';

            nuiPost('arena:stopMatch', {});
        }

        function pauseMatch() {
            state.isPaused = !state.isPaused;
            const btn = document.getElementById('pauseBtn');
            if (state.isPaused) {
                btn.textContent = 'Resume';
                btn.style.color = 'var(--success)';
                document.getElementById('statusText').textContent = 'PAUSED';
                nuiPost('arena:pauseMatch', {});
            } else {
                btn.textContent = 'Pause';
                btn.style.color = '';
                document.getElementById('statusText').textContent = 'LIVE';
                nuiPost('arena:resumeMatch', {});
            }
        }

        function updateFooter() {
            document.getElementById('footerMode').textContent = 'Mode: ' + state.gameMode;
            document.getElementById('footerRounds').textContent = 'Rounds: ' + state.maxRounds;
        }

        // ================================================================
        // NUI COMMUNICATION
        // ================================================================
        function nuiPost(event, data) {
            try {
                fetch('https://' + GetParentResourceName() + '/' + event, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data),
                });
            } catch (e) {
                console.log('[Arena Bot NUI] Post error:', e);
            }
        }

        function GetParentResourceName() {
            if (window.GetParentResourceName) {
                return window.GetParentResourceName();
            }
            return 'arena_bot'; // fallback
        }

        // Listen for NUI messages from client.lua
        window.addEventListener('message', function(event) {
            const data = event.data;
            if (data.type === 'toggleMenu') {
                if (data.show) {
                    document.body.classList.add('open');
                } else {
                    document.body.classList.remove('open');
                }
            }
            if (data.type === 'updateScore') {
                // Could update a scoreboard display here
                console.log('[Arena Bot] Score - Red:', data.red, 'Blue:', data.blue);
            }
        });

        // Close on Escape
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                document.body.classList.remove('open');
                nuiPost('closeMenu', {});
            }
        });

        // Initialize
        init();
    </script>
</body>
</html>
